      <line x1="174" y1="92" x2="184" y2="145" />
      <line x1="187" y1="89" x2="192" y2="144" />
    </g>

    <!-- Central Amaravati Purna Kumbha (Sacred Vessel of Plenty) in Green -->
    <g id="purnaKumbha" transform="translate(0, 5)">
      <!-- Vessel neck & rim -->
      <ellipse cx="200" cy="180" rx="20" ry="4" fill="#006837" stroke="#004d25" stroke-width="1" />
      
      <!-- Mango leaves sprouting from top of vase -->
      <path d="M 200,180 C 196,162 198,148 200,140 C 202,148 204,162 200,180 Z" fill="#006837" />
      <path d="M 194,181 C 182,168 174,158 170,154 C 180,161 189,171 194,181 Z" fill="#006837" />
      <path d="M 206,181 C 218,168 226,158 230,154 C 220,161 211,171 206,181 Z" fill="#006837" />
      <path d="M 197,181 C 189,165 186,152 185,146 C 192,156 196,167 197,181 Z" fill="#007934" />
      <path d="M 203,181 C 211,165 214,152 215,146 C 208,156 204,167 203,181 Z" fill="#007934" />

      <!-- Main Round Kalash Belly -->
      <path d="M 182,184 C 172,192 170,208 178,220 C 184,228 192,231 200,231 C 208,231 216,228 222,220 C 230,208 228,192 218,184 Z" fill="#006837" />

      <!-- Purna Kumbha Garland / Floral Festoons (White / pale-green ornamentation on green pot) -->
      <path d="M 176,198 Q 200,210 224,198" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 179,207 Q 200,219 221,207" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="200" cy="216" r="3" fill="#FFFFFF" />
      <circle cx="191" cy="214" r="2.5" fill="#FFFFFF" />
      <circle cx="209" cy="214" r="2.5" fill="#FFFFFF" />

      <!-- Pedestal base of Kumbha -->
      <rect x="187" y="231" width="26" height="5" rx="2" fill="#006837" />
    </g>

    <!-- Foreground Overlapping Sarnath Ashoka Lion Capital (Bright Terracotta / Orange) -->
    <g id="ashokaLions" transform="translate(0, 10)">
      <!-- Lion Capital Pedestal / Abacus -->
      <path d="M 166,326 L 234,326 L 230,338 L 170,338 Z" fill="url(#ashokaGrad)" stroke="#B71C1C" stroke-width="1" />
      <rect x="172" y="338" width="56" height="5" fill="#B71C1C" rx="1" />

      <!-- Ashoka Chakra on Abacus center -->
      <circle cx="200" cy="332" r="5" fill="#FFFFFF" stroke="#0D47A1" stroke-width="1" />
      <circle cx="200" cy="332" r="1.5" fill="#0D47A1" />

      <!-- Bull & Horse reliefs flanking chakra -->
      <circle cx="180" cy="332" r="2" fill="#FFE082" />
      <circle cx="220" cy="332" r="2" fill="#FFE082" />

      <!-- Center Lion Body & Head -->
      <!-- Chest & Mane -->
      <path d="M 176,290 C 172,305 174,322 176,326 L 224,326 C 226,322 228,305 224,290 Z" fill="url(#ashokaGrad)" />
      
      <!-- Mane curls / texture -->
      <path d="M 178,295 C 184,302 184,312 179,320" stroke="#FFE082" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M 188,292 C 193,300 193,314 188,322" stroke="#FFE082" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M 200,290 C 200,300 200,314 200,324" stroke="#FFE082" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <path d="M 212,292 C 207,300 207,314 212,322" stroke="#FFE082" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M 222,295 C 216,302 216,312 221,320" stroke="#FFE082" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Center Lion Head -->
      <circle cx="200" cy="270" r="16" fill="url(#ashokaGrad)" />
      <!-- Ears -->
      <circle cx="186" cy="258" r="4.5" fill="url(#ashokaGrad)" stroke="#B71C1C" stroke-width="0.8" />
      <circle cx="214" cy="258" r="4.5" fill="url(#ashokaGrad)" stroke="#B71C1C" stroke-width="0.8" />
      <!-- Crown / top brow -->
      <path d="M 190,258 Q 200,252 210,258 Q 200,262 190,258 Z" fill="#FFE082" />
      <!-- Eyes -->
      <circle cx="193" cy="266" r="2.2" fill="#FFFFFF" />
      <circle cx="193" cy="266" r="1.2" fill="#000000" />
      <circle cx="207" cy="266" r="2.2" fill="#FFFFFF" />
      <circle cx="207" cy="266" r="1.2" fill="#000000" />
      <!-- Snout & Whisker pad -->
      <ellipse cx="200" cy="274" rx="6" ry="4" fill="#FFE082" />
      <polygon points="198,272 202,272 200,275" fill="#B71C1C" />
      <!-- Open roaring mouth & fangs -->
      <path d="M 194,277 Q 200,283 206,277 Z" fill="#B71C1C" />
      <polygon points="196,277 197,280 198,277" fill="#FFFFFF" />
      <polygon points="202,277 203,280 204,277" fill="#FFFFFF" />

      <!-- Left Lion Profile -->
      <g>
        <path d="M 166,282 C 160,286 156,298 168,326 L 176,326 C 174,310 172,296 172,284 Z" fill="url(#ashokaGrad)" />
        <circle cx="166" cy="276" r="11" fill="url(#ashokaGrad)" />
        <circle cx="157" cy="268" r="3.5" fill="url(#ashokaGrad)" />
        <circle cx="162" cy="274" r="1.8" fill="#FFFFFF" />
        <circle cx="162" cy="274" r="1" fill="#000000" />
        <path d="M 155,278 Q 160,283 165,280" fill="#B71C1C" stroke="#B71C1C" stroke-width="1" />
      </g>

      <!-- Right Lion Profile -->
      <g>
        <path d="M 234,282 C 240,286 244,298 232,326 L 224,326 C 226,310 228,296 228,284 Z" fill="url(#ashokaGrad)" />
        <circle cx="234" cy="276" r="11" fill="url(#ashokaGrad)" />
        <circle cx="243" cy="268" r="3.5" fill="url(#ashokaGrad)" />
        <circle cx="238" cy="274" r="1.8" fill="#FFFFFF" />
        <circle cx="238" cy="274" r="1" fill="#000000" />
        <path d="M 245,278 Q 240,283 235,280" fill="#B71C1C" stroke="#B71C1C" stroke-width="1" />
      </g>
    </g>

    <!-- Bottom Telugu National Motto: సత్యమేవ జయతే -->
    <text x="200" y="416" font-family="'Noto Sans Telugu', 'Gautami', 'Mandali', 'Arial', sans-serif" font-weight="700" font-size="24" fill="#006837" text-anchor="middle" letter-spacing="1">
      సత్యమేవ జయతే
    </text>
  </g>
</svg>
