<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <!-- Circular text paths -->
    <!-- Top arc for Andhra Pradesh Prabhutvam (Telugu) -->
    <path id="topArcTelugu" d="M 68,200 A 132,132 0 0,1 332,200" fill="none" />
    <!-- Left arc for ANDHRA PRADESH (English) -->
    <path id="leftArcEnglish" d="M 68,200 A 132,132 0 0,0 200,332" fill="none" />
    <!-- Right arc for Aandhra Pradesh (Hindi) -->
    <path id="rightArcHindi" d="M 332,200 A 132,132 0 0,1 200,332" fill="none" />
    
    <!-- Sunburst gold gradient -->
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="60%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FDD835" />
    </radialGradient>

    <!-- Ashoka Lion terracotta gradient -->
    <linearGradient id="ashokaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="50%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Green branding color -->
    <color id="apGreen">#006837</color>
  </defs>

  <g id="apGovtEmblem">
    <!-- Outer Green Border Rings -->
    <circle cx="200" cy="200" r="188" fill="#FFFFFF" stroke="#006837" stroke-width="4" />
    <circle cx="200" cy="200" r="182" fill="none" stroke="#006837" stroke-width="1.5" />
    
    <!-- Mid Ring Separator -->
    <circle cx="200" cy="200" r="142" fill="none" stroke="#006837" stroke-width="2" />
    <circle cx="200" cy="200" r="136" fill="none" stroke="#006837" stroke-width="1" stroke-dasharray="3,2" />

    <!-- Text in Outer Ring -->
    <!-- Telugu Top Text: ఆంధ్రప్రదేశ్ ప్రభుత్వం -->
    <text font-family="'Noto Sans Telugu', 'Gautami', 'Mandali', 'Arial', sans-serif" font-weight="700" font-size="19" fill="#006837" letter-spacing="1.5">
      <textPath href="#topArcTelugu" startOffset="50%" text-anchor="middle">ఆంధ్రప్రదేశ్ ప్రభుత్వం</textPath>
    </text>

    <!-- English Left Text: ANDHRA PRADESH -->
    <text font-family="'Noto Sans', 'Arial', sans-serif" font-weight="800" font-size="14.5" fill="#006837" letter-spacing="2">
      <textPath href="#leftArcEnglish" startOffset="30%" text-anchor="middle">ANDHRA PRADESH</textPath>
    </text>

    <!-- Hindi Right Text: आंध्र प्रदेश -->
    <text font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-weight="700" font-size="15" fill="#006837" letter-spacing="1.5">
      <textPath href="#rightArcHindi" startOffset="30%" text-anchor="middle">आंध्र प्रदेश</textPath>
    </text>

    <!-- Decorative Traditional Floral / Leaf Pattern Border (Kalpavriksha band) -->
    <g stroke="#006837" fill="#006837" stroke-width="1" opacity="0.9">
      <!-- 36 Beaded leaf garlands on r=122 -->
      <circle cx="200" cy="200" r="128" fill="none" stroke="#006837" stroke-width="2" />
      <circle cx="200" cy="200" r="116" fill="none" stroke="#006837" stroke-width="1" />
      
      <!-- Ornamental beads pattern around ring -->
      <g id="ringBeads">
        <circle cx="200" cy="78" r="2.5" />
        <circle cx="221" cy="80" r="2.5" />
        <circle cx="241" cy="86" r="2.5" />
        <circle cx="260" cy="95" r="2.5" />
        <circle cx="277" cy="107" r="2.5" />
        <circle cx="292" cy="122" r="2.5" />
        <circle cx="304" cy="139" r="2.5" />
        <circle cx="313" cy="158" r="2.5" />
        <circle cx="319" cy="179" r="2.5" />
        <circle cx="321" cy="200" r="2.5" />
        <circle cx="319" cy="221" r="2.5" />
        <circle cx="313" cy="242" r="2.5" />
        <circle cx="304" cy="261" r="2.5" />
        <circle cx="292" cy="278" r="2.5" />
        <circle cx="277" cy="293" r="2.5" />
        <circle cx="260" cy="305" r="2.5" />
        <circle cx="241" cy="314" r="2.5" />
        <circle cx="221" cy="320" r="2.5" />
        <circle cx="200" cy="322" r="2.5" />
        <circle cx="179" cy="320" r="2.5" />
        <circle cx="159" cy="314" r="2.5" />
        <circle cx="140" cy="305" r="2.5" />
        <circle cx="123" cy="293" r="2.5" />
        <circle cx="108" cy="278" r="2.5" />
        <circle cx="96" cy="261" r="2.5" />
        <circle cx="87" cy="242" r="2.5" />
        <circle cx="81" cy="221" r="2.5" />
        <circle cx="79" cy="200" r="2.5" />
        <circle cx="81" cy="179" r="2.5" />
        <circle cx="87" cy="158" r="2.5" />
        <circle cx="96" cy="139" r="2.5" />
        <circle cx="108" cy="122" r="2.5" />
        <circle cx="123" cy="107" r="2.5" />
        <circle cx="140" cy="95" r="2.5" />
        <circle cx="159" cy="86" r="2.5" />
        <circle cx="179" cy="80" r="2.5" />
      </g>
    </g>

    <!-- Inner Golden Yellow Sunburst Disc -->
    <circle cx="200" cy="200" r="114" fill="#FFFDE7" />
    <circle cx="200" cy="200" r="114" fill="none" stroke="#FBC02D" stroke-width="2" />
    <circle cx="200" cy="200" r="54" fill="none" stroke="#FBC02D" stroke-width="2.5" />

    <!-- Radiant Sun Rays (54 golden rays shooting from center) -->
    <g stroke="#FBC02D" stroke-width="2.2" stroke-linecap="round">
      <!-- 0 to 360 degrees rays -->
      <line x1="200" y1="88" x2="200" y2="144" />
      <line x1="213" y1="89" x2="208" y2="145" />
      <line x1="226" y1="92" x2="216" y2="147" />
      <line x1="239" y1="97" x2="223" y2="150" />
      <line x1="251" y1="104" x2="231" y2="154" />
      <line x1="262" y1="112" x2="237" y2="159" />
      <line x1="273" y1="121" x2="243" y2="164" />
      <line x1="282" y1="132" x2="249" y2="170" />
      <line x1="289" y1="144" x2="253" y2="177" />
      <line x1="296" y1="157" x2="257" y2="184" />
      <line x1="301" y1="170" x2="259" y2="192" />
      <line x1="304" y1="185" x2="260" y2="200" />
      <line x1="305" y1="200" x2="260" y2="200" />
      <line x1="304" y1="215" x2="260" y2="208" />
      <line x1="301" y1="230" x2="259" y2="216" />
      <line x1="296" y1="243" x2="257" y2="224" />
